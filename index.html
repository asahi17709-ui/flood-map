<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef3f6">
<title>แผนที่น้ำท่วมสงขลา</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{
  --ink:#0b1b26;--sub:#4a5e6a;--glass:rgba(255,255,255,.66);--edge:rgba(255,255,255,.75);
  --chip:rgba(11,27,38,.07);--ok:#18a874;--warn:#f59e0b;--bad:#e5384f;--none:#7b8b95;--blue:#0a84ff
}
@media (prefers-color-scheme:dark){
  :root{--ink:#f2f7fa;--sub:#a6b7c2;--glass:rgba(28,36,44,.62);--edge:rgba(255,255,255,.14);--chip:rgba(255,255,255,.10)}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans Thai",system-ui,sans-serif}
#map{position:absolute;inset:0;background:linear-gradient(#9fc3ea,#dbe9f6 25%,#eef3f6 45%)}
.glass{background:var(--glass);border:1px solid var(--edge);box-shadow:0 8px 24px rgba(0,0,0,.14);
  -webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5)}
@supports not (backdrop-filter:blur(1px)){.glass{background:Canvas}}
@media (prefers-reduced-transparency:reduce){.glass{background:Canvas;-webkit-backdrop-filter:none;backdrop-filter:none}}
.pill{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;z-index:1000;
  border-radius:999px;padding:.45rem .9rem;font-weight:600;font-size:.9rem;display:flex;gap:.5rem;align-items:center}
.pill b{width:.55rem;height:.55rem;border-radius:50%;background:var(--ok)}
.card{position:absolute;z-index:1000;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));
  max-height:62vh;overflow:auto;border-radius:28px;padding:.9rem}
.verdict{border-radius:20px;padding:.9rem 1rem;color:#fff;background:var(--none);display:flex;gap:.8rem;align-items:center}
.verdict .ic{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;background:rgba(255,255,255,.25);
  display:grid;place-items:center;font-size:1.3rem;font-weight:800}
.verdict strong{display:block;font-size:1.2rem;line-height:1.25}
.verdict small{display:block;font-size:.85rem;opacity:.95;line-height:1.4;margin-top:.15rem}
.row{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.7rem}
button,.call{flex:1 1 6.5rem;min-height:3rem;border:0;border-radius:999px;padding:.7rem 1rem;font:inherit;
  font-weight:600;color:var(--ink);background:var(--chip);text-align:center;text-decoration:none;cursor:pointer}
#radar[aria-pressed=true],#flood[aria-pressed=true]{background:var(--blue);color:#fff}
.call{background:var(--bad);color:#fff;display:flex;align-items:center;justify-content:center}
button:focus-visible,.call:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:.3rem .9rem;font-size:.78rem;color:var(--sub);margin-top:.7rem}
.legend i{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;margin-right:.3rem}
#floodnote{display:none;font-size:.78rem;color:var(--sub);margin-top:.6rem;line-height:1.45}
#stamp{font-size:.72rem;color:var(--sub);margin-top:.4rem}
.maplibregl-popup-content{border-radius:16px;color:#0b1b26;font-family:inherit}
@media (prefers-contrast:more){.glass{background:Canvas;border-color:CanvasText}.legend,#stamp{color:CanvasText}}
@media (prefers-color-scheme:dark){#map{background:#0f1a22}}
</style>
</head>
<body>
<div id="map" role="application" aria-label="แผนที่ระดับน้ำ"></div>
<div class="pill glass"><b></b>สงขลา · ข้อมูลสด</div>
<div class="card glass">
  <div id="verdict" class="verdict" role="status" aria-live="polite">
    <div class="ic">…</div><div><strong>กำลังตรวจตำแหน่ง</strong><small>กรุณาอนุญาตการใช้ตำแหน่ง</small></div>
  </div>
  <div class="row">
    <button id="home">ตรวจใหม่</button>
    <button id="radar" aria-pressed="false">เรดาร์ฝน</button>
    <button id="flood" aria-pressed="false">ดูน้ำท่วมหาดใหญ่ปีที่แล้ว (จำลอง)</button>
    <a class="call" href="tel:1784">โทร 1784</a>
  </div>
  <div class="legend"><span><i style="background:var(--ok)"></i>ปกติ</span><span><i style="background:var(--warn)"></i>ใกล้ตลิ่ง</span><span><i style="background:var(--bad)"></i>ล้นตลิ่ง</span><span><i style="background:var(--none)"></i>ไม่มีข้อมูล</span></div>
  <div id="floodnote">ภาพจำลองคร่าวๆ ตามช่วงความลึก 0.5–2.5 ม. ที่กรมชลประทานรายงานในเขตเทศบาลนครหาดใหญ่ (ฝน 335 มม. ใน 1 วัน เมื่อ 21 พ.ย. 2568) ไม่ใช่ขอบเขตน้ำท่วมจริง บางจุดลึกกว่านี้มาก</div>
  <div id="stamp">กำลังโหลดข้อมูล…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const COLORS={ok:'#18a874',warn:'#f59e0b',bad:'#e5384f',none:'#7b8b95'};
const RANK={none:0,ok:1,warn:2,bad:3};
const dark=matchMedia('(prefers-color-scheme:dark)').matches;
const DEM={source:'dem',exaggeration:1.4};
const map=new maplibregl.Map({container:'map',
  style:`https://tiles.openfreemap.org/styles/${dark?'dark':'liberty'}`,
  center:[100.4747,7.0086],zoom:14.2,pitch:50,bearing:0,minPitch:50,maxPitch:50,dragRotate:false,pitchWithRotate:false,touchPitch:false,minZoom:10.5,maxZoom:17,antialias:devicePixelRatio<2,pixelRatio:Math.min(devicePixelRatio,2),attributionControl:{compact:true}});
map.touchZoomRotate.disableRotation();

const $=id=>document.getElementById(id);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dist=(a,b,c,d)=>{const R=6371,t=x=>x*Math.PI/180,dl=t(c-a),dn=t(d-b);
  const h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
let stations=[],homeMarker=null,radarOn=false;

// ---- โทนสีแบบ Apple Maps: พื้นเขียวอ่อน น้ำฟ้า ถนนขาว และเงาภูเขา (หาเลเยอร์จากชื่อ อาจต้องปรับถ้าสีบางส่วนไม่เปลี่ยน) ----
function appleLook(){
  if(dark)return 0;
  let n=0;
  const set=(id,p,v)=>{try{map.setPaintProperty(id,p,v);n++}catch(e){}};
  const BLUE='#9bd6f6';
  let firstLine=null;
  map.getStyle().layers.forEach(l=>{
    const id=l.id.toLowerCase(),sl=(l['source-layer']||'').toLowerCase();
    if(l.type==='line'&&!firstLine)firstLine=l.id;
    if(l.type==='background'){set(l.id,'background-color','#e4f1bf');return}
    if(l.type==='fill'){
      if(sl==='water'||/water/.test(id))set(l.id,'fill-color',BLUE);
      else if(sl==='park'||/park|wood|forest|grass|garden|golf/.test(id))set(l.id,'fill-color','#c8e598');
      else if(sl==='landcover')set(l.id,'fill-color',['match',['get','class'],'wood','#c8e598','grass','#d6ecaa','sand','#f3ecc8','ice','#ffffff','#e4f1bf']);
      else if(sl==='landuse')set(l.id,'fill-color',['match',['get','class'],'residential','#f3f1ea','commercial','#efe5cf','retail','#efe5cf','industrial','#ebe9e2','#e9f2c6']);
      else if(sl==='building'||/building/.test(id))set(l.id,'fill-color','#e9e7e0');
    }else if(l.type==='fill-extrusion'){
      if(!BORIG&&sl==='building'){BSRC=l.source;BORIG=l.id}
      const H=['to-number',['coalesce',['get','render_height'],8]];   // ไม่มีข้อมูลความสูง ใช้ 8 ม.
      set(l.id,'fill-extrusion-height',H);
      set(l.id,'fill-extrusion-base',['to-number',['coalesce',['get','render_min_height'],0]]);
      set(l.id,'fill-extrusion-color',['interpolate',['linear'],H,0,'#ece8df',25,'#dcdcdc',80,'#c4c4c7']);
      set(l.id,'fill-extrusion-opacity',1);
      try{map.setLayerZoomRange(l.id,13,24)}catch(e){}
    }
    else if(l.type==='line'){
      if(sl==='waterway'||/waterway|river|stream|canal/.test(id))set(l.id,'line-color',BLUE);
      else if(/casing/.test(id))set(l.id,'line-color','#c0c5cd');
      else if(sl==='transportation'&&!/rail|ferry|aerialway|path|pedestrian|footway|track|steps|cable/.test(id))set(l.id,'line-color','#ffffff');
    }
  });
  map.addLayer({id:'hills',type:'hillshade',source:'dem',paint:{
    'hillshade-exaggeration':0.6,'hillshade-shadow-color':'#4f7a2e',
    'hillshade-highlight-color':'#ffffff','hillshade-accent-color':'#7da24c'}},firstLine||undefined);
  try{map.setLight({anchor:'viewport',color:'#ffffff',intensity:0.28,position:[1.15,200,45]})}catch(e){}
  return n;
}

// ---- (ทดลอง) ปัดมุมแปลนตึกให้โค้ง เฉพาะตอนซูมใกล้ ถ้าผิดพลาดจะกลับไปใช้ตึกเหลี่ยมเดิมเอง ----
let BSRC=null,BORIG=null,rTimer=null,lastKey='';
const TZ=2**14;
function onEdge(c){   // จุดที่ถูกตัดตามขอบกระเบื้องแผนที่ ไม่ปัดมุม จะได้ไม่เกิดรอยแหว่ง
  const fx=((c[0]+180)/360*TZ)%1,s=Math.sin(c[1]*Math.PI/180);
  const fy=((0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*TZ)%1,e=3e-4;
  const near=v=>v<e||v>1-e||Math.abs(v-1/64)<e||Math.abs(v-63/64)<e;
  return near(fx)||near(fy);
}
function roundRing(ring){
  const pts=ring.slice(0,-1),n=pts.length;if(n<3)return ring;
  const R=2.5/111320,out=[];
  for(let i=0;i<n;i++){
    const p=pts[(i+n-1)%n],c=pts[i],q=pts[(i+1)%n];
    const l1=Math.hypot(p[0]-c[0],p[1]-c[1]),l2=Math.hypot(q[0]-c[0],q[1]-c[1]);
    if(!l1||!l2||onEdge(c)){out.push(c);continue}
    const t1=Math.min(R/l1,.45),t2=Math.min(R/l2,.45);
    const a=[c[0]+(p[0]-c[0])*t1,c[1]+(p[1]-c[1])*t1],b=[c[0]+(q[0]-c[0])*t2,c[1]+(q[1]-c[1])*t2];
    for(let k=0;k<=4;k++){const u=k/4,v=1-u;
      out.push([v*v*a[0]+2*u*v*c[0]+u*u*b[0],v*v*a[1]+2*u*v*c[1]+u*u*b[1]])}
  }
  out.push(out[0]);return out;
}
function setRound(on){
  map.setLayoutProperty('bld-round','visibility',on?'visible':'none');
  map.setLayoutProperty(BORIG,'visibility',on?'none':'visible');
}
function updateRound(){
  if(!BORIG||!map.getSource('bld-round'))return;
  if(map.getZoom()<15){setRound(false);lastKey='';return}
  const c=map.getCenter(),key=map.getZoom().toFixed(1)+'|'+c.lng.toFixed(4)+'|'+c.lat.toFixed(4);
  if(key===lastKey)return;lastKey=key;
  try{
    const b=map.getBounds(),pad=.003,seen=new Set(),feats=[];
    for(const f of map.querySourceFeatures(BSRC,{sourceLayer:'building'})){
      const g=f.geometry;if(!g||(g.type!=='Polygon'&&g.type!=='MultiPolygon'))continue;
      const polys=g.type==='Polygon'?[g.coordinates]:g.coordinates;
      for(const poly of polys){
        const c0=poly[0][0];
        if(c0[0]<b.getWest()-pad||c0[0]>b.getEast()+pad||c0[1]<b.getSouth()-pad||c0[1]>b.getNorth()+pad)continue;
        const k=c0[0]+','+c0[1]+','+poly[0].length;if(seen.has(k))continue;seen.add(k);
        feats.push({type:'Feature',properties:{h:Number(f.properties.render_height)||8,b:Number(f.properties.render_min_height)||0},
          geometry:{type:'Polygon',coordinates:poly.map(roundRing)}});
        if(feats.length>4000)throw new Error('too many');
      }
    }
    if(!feats.length)throw new Error('none');
    map.getSource('bld-round').setData({type:'FeatureCollection',features:feats});
    setRound(true);
  }catch(e){setRound(false)}
}

// ---- จำลองน้ำท่วมหาดใหญ่ ปี 2568: 3 โซนความลึก ยกระดับน้ำด้วยตัวเลขตัวเดียว เบามาก (รูปทรงเป็นการประมาณ ไม่ใช่ขอบเขตจริง) ----
const zone=(d,ring)=>({type:'Feature',properties:{d},geometry:{type:'Polygon',coordinates:[ring.concat([ring[0]])]}});
const FLOOD={type:'FeatureCollection',features:[
  zone(0.5,[[100.430,6.980],[100.438,7.035],[100.470,7.062],[100.515,7.055],[100.532,7.015],[100.520,6.968],[100.480,6.950],[100.445,6.955]]),
  zone(1.5,[[100.448,6.990],[100.452,7.030],[100.478,7.045],[100.505,7.035],[100.512,7.005],[100.498,6.975],[100.470,6.970]]),
  zone(2.5,[[100.458,7.000],[100.462,7.024],[100.482,7.030],[100.498,7.018],[100.494,6.995],[100.475,6.988]])]};
let floodOn=false,floodT=0,floodRaf=0;
function setFlood(t){floodT=t;map.setPaintProperty('flood','fill-extrusion-height',['*',['get','d'],t])}
async function toggleFlood(){
  await ready;
  floodOn=!floodOn;
  $('flood').setAttribute('aria-pressed',floodOn);
  $('floodnote').style.display=floodOn?'block':'none';
  if(floodOn){
    map.setLayoutProperty('flood','visibility','visible');
    map.fitBounds([[100.425,6.945],[100.54,7.065]],{padding:{top:70,bottom:320,left:16,right:16},duration:1200});
  }
  cancelAnimationFrame(floodRaf);
  const from=floodT,to=floodOn?1:0,t0=performance.now(),dur=floodOn?6000:1500;
  const step=now=>{
    const k=Math.min((now-t0)/dur,1);setFlood(from+(to-from)*k);
    if(k<1)floodRaf=requestAnimationFrame(step);
    else if(!floodOn)map.setLayoutProperty('flood','visibility','none');
  };
  floodRaf=requestAnimationFrame(step);
}

const ready=new Promise(res=>map.on('load',()=>{
  map.addSource('dem',{type:'raster-dem',encoding:'terrarium',tileSize:256,maxzoom:14,
    tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png']});
  window.paintN=appleLook();
  if(BORIG){
    map.addSource('bld-round',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
    map.addLayer({id:'bld-round',type:'fill-extrusion',source:'bld-round',minzoom:15,layout:{visibility:'none'},paint:{
      'fill-extrusion-height':['get','h'],'fill-extrusion-base':['get','b'],'fill-extrusion-opacity':1,
      'fill-extrusion-color':['interpolate',['linear'],['get','h'],0,'#ece8df',25,'#dcdcdc',80,'#c4c4c7']}});
  }
  map.addSource('flood',{type:'geojson',data:FLOOD});
  map.addLayer({id:'flood',type:'fill-extrusion',source:'flood',layout:{visibility:'none'},paint:{
    'fill-extrusion-color':['interpolate',['linear'],['get','d'],0.5,'#8ecae6',1.5,'#4aa3d8',2.5,'#1f6fb5'],
    'fill-extrusion-height':['*',['get','d'],0],'fill-extrusion-base':0,'fill-extrusion-opacity':0.6}});
  map.addSource('st',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'st-dots',type:'circle',source:'st',paint:{
    'circle-radius':9,'circle-stroke-color':'#fff','circle-stroke-width':2,
    'circle-color':['match',['get','status'],'ok',COLORS.ok,'warn',COLORS.warn,'bad',COLORS.bad,COLORS.none]}});
  map.on('click','st-dots',e=>{
    const p=e.features[0].properties,m=p.margin===null||p.margin==='null'||p.margin===undefined?null:Number(p.margin);
    const gap=m===null?'ไม่มีข้อมูลตลิ่ง':(m>=0?`ต่ำกว่าตลิ่ง ${m.toFixed(2)} ม.`:`สูงกว่าตลิ่ง ${(-m).toFixed(2)} ม.`);
    new maplibregl.Popup({offset:12}).setLngLat(e.lngLat)
      .setHTML(`<b>${esc(p.name)}</b><br>${esc(p.river)}<br>${gap}<br><small>วัดเมื่อ ${esc(p.time)||'-'}</small>`).addTo(map);
  });
  map.on('mouseenter','st-dots',()=>map.getCanvas().style.cursor='pointer');
  map.on('mouseleave','st-dots',()=>map.getCanvas().style.cursor='');
  res();
}));

// ---- แหล่งข้อมูลระดับน้ำ (ยังไม่ได้ยืนยันกับข้อมูลจริง: ถ้าจุดไม่ขึ้น ให้แก้เฉพาะฟังก์ชัน pick) ----
const SOURCE='https://api-v3.thaiwater.net/api/v1/thaiwater30/public/waterlevel_load';
const BOX={minLat:6.4,maxLat:7.6,minLng:100.0,maxLng:101.2}; // สงขลา เปลี่ยนเลข 4 ตัวนี้เพื่อใช้จังหวัดอื่น
function pick(row){
  const st=row.station||{};
  const name=(st.tele_station_name&&(st.tele_station_name.th||st.tele_station_name))||st.name||'';
  return {name,
    lat:Number(st.tele_station_lat??st.lat),lng:Number(st.tele_station_long??st.lng),
    level:Number(row.waterlevel_msl??row.waterlevel_value),
    bank:Number(st.min_bank??row.min_bank??row.bank_level),
    river:row.river_name?.th||st.river_name||'',time:row.waterlevel_datetime||row.datetime||''};
}
const statusOf=m=>m==null?'none':m<0?'bad':m<0.5?'warn':'ok'; // ล้นตลิ่ง / ห่างตลิ่งน้อยกว่า 0.5 ม. / ปกติ
function normalize(rows){
  return rows.map(pick).filter(s=>Number.isFinite(s.lat)&&Number.isFinite(s.lng)&&
    s.lat>=BOX.minLat&&s.lat<=BOX.maxLat&&s.lng>=BOX.minLng&&s.lng<=BOX.maxLng)
  .map(s=>{const margin=Number.isFinite(s.level)&&Number.isFinite(s.bank)?s.bank-s.level:null;
    return {name:s.name,river:s.river,lat:s.lat,lng:s.lng,margin,time:s.time,status:statusOf(margin)}});
}

async function loadStations(){
  try{
    let list=null;   // ลองตัวกลาง /api/stations ก่อน (ถ้ามี) ไม่มีก็ดึงตรงจากต้นทาง
    try{const a=await fetch('/api/stations');if(a.ok){const j=await a.json();if(Array.isArray(j))list=j}}catch(e){}
    if(!list){const r=await fetch(SOURCE);if(!r.ok)throw 0;list=normalize((await r.json()).data||[])}
    stations=list;await ready;
    map.getSource('st').setData({type:'FeatureCollection',features:stations.map(s=>({type:'Feature',
      geometry:{type:'Point',coordinates:[s.lng,s.lat]},properties:{name:s.name,river:s.river,margin:s.margin,time:s.time,status:s.status}}))});
    $('stamp').textContent='อัปเดต '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})+' · น้ำ: สสน./ชป. · ฝน: Open-Meteo, RainViewer · ปรับสี '+(window.paintN||0)+' ชั้น';
  }catch(e){$('stamp').textContent='โหลดข้อมูลสถานีวัดน้ำไม่สำเร็จ (แผนที่และเรดาร์ยังใช้ได้) จะลองใหม่ใน 5 นาที';}
}

async function toggleRadar(){
  const b=$('radar');await ready;
  if(radarOn){map.removeLayer('radar');map.removeSource('radar');radarOn=false;b.setAttribute('aria-pressed','false');return}
  try{
    const j=await (await fetch('https://api.rainviewer.com/public/weather-maps.json')).json();
    const f=j.radar.past[j.radar.past.length-1];
    map.addSource('radar',{type:'raster',tileSize:256,tiles:[`${j.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`]});
    map.addLayer({id:'radar',type:'raster',source:'radar',paint:{'raster-opacity':.65}},'st-dots');
    radarOn=true;b.setAttribute('aria-pressed','true');
  }catch(e){$('stamp').textContent='โหลดเรดาร์ไม่สำเร็จ ลองอีกครั้ง'}
}

function show(level,icon,title,sub){
  const v=$('verdict');v.style.background=COLORS[level];
  v.innerHTML=`<div class="ic" aria-hidden="true">${icon}</div><div><strong>${title}</strong><small>${sub}</small></div>`;
}

function checkHome(){
  show('none','…','กำลังตรวจตำแหน่ง','กรุณาอนุญาตการใช้ตำแหน่ง');
  if(!navigator.geolocation){show('none','?','ใช้ตำแหน่งไม่ได้','เครื่องนี้ไม่รองรับ ดูจากแผนที่ได้เลย');return}
  navigator.geolocation.getCurrentPosition(async p=>{
    const {latitude:la,longitude:lo}=p.coords;
    map.flyTo({center:[lo,la],zoom:15,duration:1500});
    if(homeMarker)homeMarker.remove();
    homeMarker=new maplibregl.Marker({color:'#0a84ff'}).setLngLat([lo,la]).addTo(map);
    const near=stations.map(s=>({...s,d:dist(la,lo,s.lat,s.lng)})).filter(s=>s.d<=25).sort((a,b)=>a.d-b.d);
    let worst='none';near.forEach(s=>{if(RANK[s.status]>RANK[worst])worst=s.status});
    let rain=0;
    try{
      const w=await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&hourly=precipitation&forecast_days=2&timezone=Asia%2FBangkok`)).json();
      const now=new Date().getHours();rain=w.hourly.precipitation.slice(now,now+24).reduce((a,b)=>a+b,0);
    }catch(e){}
    let level=worst==='none'?'ok':worst;
    if(rain>50)level='bad';else if(rain>20&&level==='ok')level='warn';
    const t={ok:['✓','ตอนนี้ยังปลอดภัย'],warn:['!','เฝ้าระวัง'],bad:['✕','เสี่ยงสูง เตรียมพร้อมอพยพ']}[level];
    const st=near.length?`สถานีใกล้สุด ${esc(near[0].name)} (${near[0].d.toFixed(0)} กม.)`:'ไม่มีสถานีวัดน้ำในรัศมี 25 กม.';
    show(level,t[0],t[1],`${st}<br>ฝน 24 ชม. ข้างหน้า ประมาณ ${rain.toFixed(0)} มม.`);
  },()=>show('none','?','ไม่ได้รับสิทธิ์ใช้ตำแหน่ง','เปิดสิทธิ์ในตั้งค่าเบราว์เซอร์ หรือดูจากแผนที่ได้เลย'),{enableHighAccuracy:true,timeout:10000});
}

map.on('idle',()=>{clearTimeout(rTimer);rTimer=setTimeout(updateRound,300)});
$('flood').onclick=toggleFlood;
$('home').onclick=checkHome;$('radar').onclick=toggleRadar;
loadStations().then(checkHome);
setInterval(loadStations,5*60*1000);
</script>
